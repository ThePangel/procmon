[package]
name = "procmon-cli"
version = "0.1.0"
edition = "2024"
description = "Process memory monitor for Linux and Windows inspired by WOZMON"
license = "GPL-3.0-only"
repository = "https://github.com/thepangel/procmon"
readme = "README.md"
keywords = ["process", "memory", "monitor", "debugging", "cli"]
categories = ["command-line-utilities", "development-tools::debugging"]

[dependencies]
clap = { version = "4.6.9", features = ["derive"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.191"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_System_Memory",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_Security",
] }
